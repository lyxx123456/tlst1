}
function ensureDock(curActive, dockNav, badge){
  var tab = document.getElementById('tabBar');
  if (!tab) return;
  var dock = tab.querySelector('.glass-dock');
  if (!dock || !dock.__glassBound){
    // 首次：整段构建 Dock
    tab.innerHTML = '<div class="glass-dock" id="glassDock">'+
      '<span class="dock-highlight" id="glassCapsule"></span>'+
      dockNav.map(function(it){
        var b = badge[it.k];
        return '<button type="button" class="dock-item'+(curActive===it.k?' active':'')+'" data-key="'+it.k+'">'+
          '<span class="dock-ico">'+ICONS[it.k]+'</span>'+
          '<span class="dock-txt">'+it.n+'</span>'+
          (b?'<span class="dock-badge">'+b+'</span>':'')+'</button>';
      }).join('')+
      '<svg class="dock-svg" aria-hidden="true">'+
        '<defs><filter id="dock-refract" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">'+
          '<feImage id="dock-map" result="map" xlink:href="" preserveAspectRatio="none"></feImage>'+
          '<feDisplacementMap id="dock-disp" in="SourceGraphic" in2="map" scale="0" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>'+
        '</filter></defs>'+
      '</svg>'+
    '</div>';
    mountGlassDock();
    return;
  }
  // Dock 已存在：只更新角标 + 胶囊平滑移动，避免整段重建造成“瞬移”
  var items = Array.prototype.slice.call(dock.querySelectorAll('.dock-item'));
  items.forEach(function(el){
    var k = el.getAttribute('data-key');
    var b = badge[k];
    var bd = el.querySelector('.dock-badge');
    if (b){
      if (bd){ bd.textContent = b; bd.style.display = ''; }
      else { el.insertAdjacentHTML('beforeend', '<span class="dock-badge">'+b+'</span>'); }
    } else if (bd) { bd.style.display = 'none'; }
  });
  var idx = -1;
  items.forEach(function(el, i){ if (el.getAttribute('data-key') === curActive) idx = i; });
  if (idx >= 0) dock.__dockMove(idx, true);
  else dock.__dockClear();
}

    banks:AppState.banks, questions:AppState.questions, stats:stats, exams:AppState.exams, settings:AppState.settings };

function importBackup(){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=function(){
    var f=inp.files[0]; if(!f) return;
    readFileAsText(f).then(function(t){
      var d=JSON.parse(t);
      if(!d || !d.questions) throw new Error('不是有效的备份文件');
      var qs=d.questions, bks=d.banks||[];
      return Promise.all([DB.bulkPut('banks', bks), DB.bulkPut('questions', qs), DB.bulkPut('stats', d.stats||[])])
        .then(function(){
          AppState.banks=bks; AppState.questions=qs;
          AppState.qMap=new Map(); qs.forEach(function(q){ AppState.qMap.set(q.id,q); });
          AppState.bankMap=new Map(); bks.forEach(function(b){ AppState.bankMap.set(b.id,b); });
          (d.stats||[]).forEach(function(s){ AppState.stats.set(s.qid, s); });
          if(d.settings) { AppState.settings=deepMerge(DEFAULT_SETTINGS, d.settings); saveSettings(); }
          if(d.exams) AppState.exams=d.exams;
          toast('备份已恢复'); render();
        });
    }).catch(function(e){ toast('恢复失败：'+e.message); });
  };
  inp.click();
}

/* ============================================================
 * 13. 判题引擎（离线）
 * ========================================================== */
var PUNCT_RE = /[\s.,，。、；;：:？?！!'"“”‘’（）()《》〈〉【】\[\]{}·—…\-_\/\\|~`@#$%^&*+=]/g;
function full2half(s){
  return String(s||'').replace(/[\uFF01-\uFF5E]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0)-0xFEE0); }).replace(/\u3000/g,' ');
}
function normalizeText(s){
  return full2half(s).toLowerCase().replace(PUNCT_RE,'');
}
var STOP_WORDS = {'的':1,'和':1,'与':1,'是':1,'在':1,'了':1,'应':1,'必须':1,'进行':1,'不得':1,'可以':1,'要求':1,'规定':1,
  '情况':1,'对':1,'及':1,'或':1,'等':1,'为':1,'由':1,'其':1,'中':1,'一个':1,'以上':1,'以下':1,'按照':1,'根据':1,'有关':1,
  '相关':1,'方面':1,'工作':1,'作业':1,'人员':1,'应当':1,'需要':1,'不能':1,'严禁':1,'this':1,'the':1,'and':1};
function extractKeywords(s){
  var seg = s.split(/[^\u4e00-\u9fa5A-Za-z0-9]+/).filter(function(x){ return x.length>=2; });
  var out=[], seen={};
  seg.forEach(function(w){ if(!STOP_WORDS[w] && !seen[w]){ seen[w]=1; out.push(w); } });
  if(out.length<4){
    for(var i=0;i<s.length-1 && out.length<14;i++){
      var g=s.substr(i,2);
      if(!seen[g] && !STOP_WORDS[g]){ seen[g]=1; out.push(g); }
    }
  }
  return out.slice(0,14);
}
function bigrams(s){
  var m={}, n=0;
  if(s.length<2){ if(s) m[s]=1; return {set:m, n:s?1:0}; }
  for(var i=0;i<s.length-1;i++){ var g=s.substr(i,2); if(!m[g]){ m[g]=1; n++; } }
  return {set:m, n:n};
}
function jaccard(a, b){
  var A=bigrams(a), B=bigrams(b);
  if(!A.n || !B.n) return (a&&a===b)?1:0;
  var inter=0;
  for(var k in A.set) if(B.set[k]) inter++;
  return inter/(A.n+B.n-inter);
}
function levDist(a, b){
  if(a===b) return 0;
  if(!a.length) return b.length;
  if(!b.length) return a.length;
  var prev=new Array(b.length+1), cur=new Array(b.length+1), i, j;
  for(j=0;j<=b.length;j++) prev[j]=j;
  for(i=1;i<=a.length;i++){
    cur[0]=i;
    for(j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
    }
    var t=prev; prev=cur; cur=t;
  }
  return prev[b.length];
}
/* 简答题三维启发式评分 */
function scoreShort(userAns, stdAns, cfg){
  var u=normalizeText(userAns||''), s=normalizeText(stdAns||'');
  if(!u) return {score:0, kwRate:0, simRate:0, lenRate:0, hit:[], miss:[]};
  if(!s) return {score:0, kwRate:0, simRate:0, lenRate:0, hit:[], miss:[]};
  if(u===s) return {score:100, kwRate:1, simRate:1, lenRate:1, hit:extractKeywords(s), miss:[]};
  var kws=extractKeywords(String(stdAns||'').toLowerCase()).map(normalizeText).filter(function(x){ return x.length>=2; });
  var uniq={}; kws=kws.filter(function(k){ if(uniq[k]) return false; uniq[k]=1; return true; });
  var hit=[], miss=[];
  kws.forEach(function(k){ if(u.indexOf(k)>=0) hit.push(k); else miss.push(k); });
  var kwRate = kws.length? hit.length/kws.length : (u.length>0?0.3:0);
  var jac = jaccard(u, s);
  var ld = levDist(u, s);
  var ldRate = 1 - ld/Math.max(u.length, s.length);
  if(ldRate<0) ldRate=0;
  var simRate = clamp(jac*0.6 + ldRate*0.4, 0, 1);
  var need = Math.max(8, s.length*0.7);
  var lenRate = clamp(u.length/need, 0, 1);
  var total = cfg.wKeyword*kwRate + cfg.wSimilarity*simRate + cfg.wLength*lenRate;
  return {score: Math.round(total), kwRate:kwRate, simRate:simRate, lenRate:lenRate, hit:hit, miss:miss};
}
function judgeAnswer(q, ans){
  var cfg=AppState.settings.scoring;
  if(q.type==='single'){
    var ok = String(ans||'').toUpperCase()===String(q.answer||'').toUpperCase();
    return {correct:ok, score:ok?1:0};
  }
  if(q.type==='multiple'){
    var std=String(q.answer||'').toUpperCase().split('');
    var usr=String(ans||'').toUpperCase().split('');
    if(!usr.length) return {correct:false, score:0, note:'未作答'};
    var wrong=usr.filter(function(c){ return std.indexOf(c)<0; });
    if(wrong.length) return {correct:false, score:0, note:'含错选：'+wrong.join('')};
    var missing=std.filter(function(c){ return usr.indexOf(c)<0; });
    if(!missing.length) return {correct:true, score:1};
    if(!cfg.multiplePartial) return {correct:false, score:0, note:'漏选：'+missing.join('')};
    return {correct:false, score:clamp(cfg.partialRatio*(usr.length/std.length),0,0.99), note:'漏选：'+missing.join('')+'（部分分）'};
  }
  if(q.type==='judge'){
    var ok2 = String(ans||'')===String(q.answer||'');
    return {correct:ok2, score:ok2?1:0};
  }
  if(q.type==='fill'){
    var stdArr=String(q.answer||'').split('|||');
    var usrArr = Array.isArray(ans)? ans : String(ans||'').split('|||');
    var n=Math.max(stdArr.length, usrArr.length, 1);
    var marks=[];
    for(var i=0;i<n;i++){
      var a=normalizeText(usrArr[i]||''), b=normalizeText(stdArr[i]||'');
      marks.push({i:i, ok: !!a && a===b, user:usrArr[i]||'', std:stdArr[i]||''});
    }
    var okCount=marks.filter(function(m){ return m.ok; }).length;
    /* 尝试无序匹配 */
    var okUnordered=0;
    var pool=marks.map(function(m){ return m; });
    var usedStd={};
    marks.forEach(function(m){
      for(var k=0;k<stdArr.length;k++){
        if(usedStd[k]) continue;
        if(normalizeText(m.user) && normalizeText(m.user)===normalizeText(stdArr[k])){ usedStd[k]=1; okUnordered++; break; }
      }
    });
    var score=Math.max(okCount, okUnordered)/n;
    return {correct: score>=0.999, score:score, blanks:marks};
  }
  /* short */
  var r=scoreShort(ans, q.answer, cfg);
  return {correct: r.score>=cfg.shortPass, score: clamp(r.score/100,0,1), short:r};
}
function fmtUserAnswer(q, ans){
  if(ans==null || ans==='') return '（未作答）';
  if(q.type==='fill') return (Array.isArray(ans)?ans:[ans]).map(function(x,i){ return '第'+(i+1)+'空：'+(x||'空'); }).join('   ');
  if(q.type==='multiple') return String(ans).split('').join(' ');
  return String(ans);
}

      return;
    }
    openBankSelector({
    mode: mode,
    title: mode==='order'?'顺序刷题':'随机刷题',

      var list = qs.filter(function(q){ return (!bankIds.length||bankIds.indexOf(q.bankId)>=0) && types.indexOf(q.type)>=0; });

      startSession({view:'practice', mode:'practice', pkey:'practice:'+mode, list:list, title: mode==='order'?'顺序刷题':'随机刷题'});
      return true;
    }
    });
  });
}

}

var STUDY_ORDER=['fill','single','multiple','judge','short'];   /* 填空→单选→多选→判断→简答 */
function sortByStudyOrder(list){
  return list.slice().sort(function(a,b){
    var ia=STUDY_ORDER.indexOf(a.type), ib=STUDY_ORDER.indexOf(b.type);
    ia = ia<0? 99:ia; ib = ib<0? 99:ib;
    return ia-ib;   /* 同题型保持原始顺序（ES 稳定排序） */
  });
}
function saveProgress(s){
  if(!s || s.mode==='exam') return;                 /* 模考不记录续做进度 */
  try{
    DB.put('progress', {
      key: s.pkey || s.mode, mode: s.mode, title: s.title,
      qids: s.list.map(function(q){ return q.id; }),
      idx: s.idx, answers: s.answers||{}, results: s.results||{},
      correct: s.correct||0, wrong: s.wrong||0, flags: s.flags||{},
      finished: !!s.finished, updatedAt: Date.now()
    });
  }catch(e){}
}
function loadProgress(mode){

function renderQuestionArea(s){

    '<div class="row between wrap gap8">'+
      '<div class="row wrap gap8">'+typeBadge(q.type)+
        (q.category?'<span class="badge">'+esc(q.category)+'</span>':'')+
        (q.difficulty?'<span class="badge orange">'+esc(q.difficulty)+'</span>':'')+
        (s.mode==='exam'?'':'<span class="tiny muted">'+esc(q.bankName||'')+'</span>')+
      '</div>'+
      '<div class="tiny muted">'+(s.idx+1)+' / '+s.list.length+'</div>'+
    '</div>'+
    '<div class="qtext mt12">'+highlightBlanks(q.question, q.type==='fill')+'</div>';
  /* 选项区 */
  if(q.type==='single'||q.type==='multiple'){
    h += '<div class="mt16">'+ q.options.map(function(o,i){
      var k=String.fromCharCode(65+i);
      var sel = q.type==='single' ? ans===k : (String(ans||'').indexOf(k)>=0);
      var cls='';
      if(reveal){
        var isOk = q.answer.indexOf(k)>=0;
        if(isOk) cls='correct';
        else if(sel) cls='wrong';
        else cls='disabled';
      }else if(sel) cls='sel';
      return '<div class="opt '+cls+(locked?' locked':'')+'" data-k="'+k+'"><div class="opt-key">'+k+'</div><div class="opt-text">'+esc(o)+'</div></div>';
    }).join('') +'</div>';
    if(q.type==='multiple' && !locked) h+='<div class="hint">多选题：可多选，点击再次点击取消</div>';
  }else if(q.type==='judge'){
    h += '<div class="judge-row mt16">';
    ['对','错'].forEach(function(v){
      var sel=ans===v, cls='';
      if(reveal){ if(q.answer===v) cls='correct'; else if(sel) cls='wrong'; }
      else if(sel) cls='sel';
      h += '<div class="judge-btn '+cls+'" data-v="'+v+'">'+v+'</div>';
    });
    h += '</div>';
  }else if(q.type==='fill'){
    var n=Math.max(q.blankCount||1, 1);
    h += '<div class="mt16">';
    for(var i=0;i<n;i++){
      var val=(Array.isArray(ans)?ans[i]:'')||'';
      var mk = res&&res.blanks? res.blanks[i] : null;
      h += '<div class="fill-blank"><div class="fill-idx'+(mk? (mk.ok?' ok':' no'):'')+'">'+(i+1)+'</div>'+
        '<input class="input" data-fi="'+i+'" placeholder="第 '+(i+1)+' 空" value="'+esc(val)+'"'+(locked?' disabled':'')+'>'+
        (mk?'<div class="tiny '+(mk.ok?'':'')+'" style="color:'+(mk.ok?'var(--green)':'var(--red)')+'">'+(mk.ok?'✓':'正确答案：'+esc(mk.std))+'</div>':'')+
        '</div>';
    }
    h += '</div>';
  }else if(q.type==='short'){
    h += '<div class="mt16"><textarea class="ta" id="shortAns" placeholder="请写出你的答案（本地启发式评分：关键词 + 相似度 + 完整度）"'+(locked?' disabled':'')+'>'+esc(ans||'')+'</textarea></div>';
  }
  /* 反馈 */
  if(res) h += feedbackHTML(q, res, ans, s);
  h += '</div>';
  return h;
}
function feedbackHTML(q, res, ans, s){
  /* 模拟考试：不揭示对错、答案与评分，交卷后统一展示 */
  if(s && s.mode==='exam'){
    return '<div class="fb neutral"><div class="row between"><div class="strong">✓ 本题已作答</div>'+
      '<span class="tiny muted">交卷后查看对错与评分</span></div>'+
      '<div class="fb-row"><div class="fb-label">你的答案</div><div class="fb-val">'+esc(fmtUserAnswer(q, ans))+'</div></div></div>';
  }
  var h='<div class="fb '+(res.correct?'good':'bad')+'">';
  h += '<div class="row between"><div class="strong" style="color:'+(res.correct?'#1E9E45':'var(--red)')+'">'+
       (res.correct?'✓ 回答正确':(res.score>0?'◐ 部分正确（'+Math.round(res.score*100)+'%）':'✕ 回答错误'))+'</div>'+
       (res.note?'<span class="tiny" style="color:var(--sub)">'+esc(res.note)+'</span>':'')+'</div>';
  h += '<div class="fb-row"><div class="fb-label">你的答案</div><div class="fb-val">'+esc(fmtUserAnswer(q, ans))+'</div></div>';
  h += '<div class="fb-row"><div class="fb-label">正确答案</div><div class="fb-val strong">'+esc(answerDisplay(q))+'</div></div>';
  if(q.type==='fill' && res.blanks){
    h += '<div class="fb-row"><div class="fb-label">逐空反馈</div><div class="fb-val">'+
      res.blanks.map(function(b){ return '第'+(b.i+1)+'空 '+(b.ok?'<span style="color:#1E9E45">✓</span>':'<span style="color:var(--red)">✗</span>'); }).join(' · ')+'</div></div>';
  }
  if(q.type==='short' && res.short){
    var r=res.short;
    h += '<div class="mt8" style="background:rgba(255,255,255,.6);border-radius:10px;padding:10px 12px">'+
      '<div class="row between small"><span class="sub">本题得分</span><span class="strong">'+(res.score*100).toFixed(0)+' 分'+(res.correct?'（通过）':'（未通过）')+'</span></div>'+
      '<div class="progress thin mt8"><div style="width:'+clamp(r.score,0,100)+'%"></div></div>'+
      '<div class="row wrap gap8 mt8">'+
        '<span class="badge blue">关键词 '+Math.round(r.kwRate*AppState.settings.scoring.wKeyword)+'/'+AppState.settings.scoring.wKeyword+'</span>'+
        '<span class="badge">相似度 '+Math.round(r.simRate*AppState.settings.scoring.wSimilarity)+'/'+AppState.settings.scoring.wSimilarity+'</span>'+
        '<span class="badge">完整度 '+Math.round(r.lenRate*AppState.settings.scoring.wLength)+'/'+AppState.settings.scoring.wLength+'</span>'+
      '</div>'+
      (r.hit.length?'<div class="tiny mt8" style="color:var(--sub)">命中关键词：'+r.hit.slice(0,12).map(function(x){ return '<span class="badge green">'+esc(x)+'</span>'; }).join(' ')+'</div>':'')+
      '</div>';
  }
  if(q.analysis) h += '<div class="analysis-box">'+nl2br(q.analysis)+'</div>';
  if(AppState.settings.llm.apiKey && !res.correct){
    h += '<div class="mt12"><button class="btn sm" id="aiBtn">✨ AI 深度解析</button></div><div id="aiSlot"></div>';
  }
  h += '</div>';
  return h;
}
function bindQuestionArea(root, s){
  var q=curQ(s);
  var res=s.results[s.idx];
  root.querySelectorAll('.opt').forEach(function(el){
    if(res) return;
    el.onclick=function(){
      var k=el.getAttribute('data-k');
      if(q.type==='single'){ s.answers[s.idx]=k; }
      else{
        var cur=String(s.answers[s.idx]||'');
        if(cur.indexOf(k)>=0) cur=cur.split('').filter(function(c){ return c!==k; }).join('');
        else cur=(cur+k).split('').sort().join('');
        s.answers[s.idx]=cur;
      }
      buzz(8);
      refreshSessionArea();
    };
  });
  root.querySelectorAll('.judge-btn').forEach(function(el){
    if(res) return;
    el.onclick=function(){ s.answers[s.idx]=el.getAttribute('data-v'); buzz(8); refreshSessionArea(); };
  });
  var ta=root.querySelector('#shortAns');
  if(ta && !res) ta.oninput=function(){ s.answers[s.idx]=ta.value; };
  root.querySelectorAll('input[data-fi]').forEach(function(inp){
    if(res) return;
    inp.oninput=function(){
      var i=parseInt(inp.getAttribute('data-fi'),10);
      var arr=s.answers[s.idx]; if(!Array.isArray(arr)) arr=[];
      arr[i]=inp.value; s.answers[s.idx]=arr;
    };
  });
  var ai=root.querySelector('#aiBtn');
  if(ai) ai.onclick=function(){
    llmExplain(q, fmtUserAnswer(q, s.answers[s.idx]), root.querySelector('#aiSlot'), ai);
  };
}
function hasAnswer(q, ans){
  if(ans==null||ans==='') return false;
  if(q.type==='fill'){ if(!Array.isArray(ans)) return false; return ans.some(function(x){ return String(x||'').trim(); }); }
  return true;
}
/* AI 简答评分进行中的任务表（qid → promise），交卷前需等待完成 */
var aiGradeJobs = {};
function submitCurrent(s){
  var q=curQ(s);
  var ans=s.answers[s.idx];
  var res;
  if(!hasAnswer(q, ans)){
    /* 允许空答案提交：记为「未作答」，直接看正确答案与解析 */
    res={ correct:false, score:0, note:'未作答' };
  }else{
    if(Array.isArray(ans)) ans = q.type==='fill'? ans.map(function(x){ return String(x||'').trim(); }) : ans;
    res=judgeAnswer(q, ans);
  }
  s.results[s.idx]=res;
  if(s.mode!=='exam'){
    updateStat(q.id, res.correct, res.correct?4:1);
    dailyAdd(1, res.correct);
    if(res.correct) s.correct++; else s.wrong++;
    buzz(res.correct?20:40);
  }else{
    buzz(res.correct?20:40);
    /* 模拟考试 · 简答大题：后台评分（已配置 AI 用 AI，否则本地模型）；评分考试期间不可见 */
    if(q.type==='short' && hasAnswer(q, ans)){
      if(llmConfigured()){
        res.gradedBy='ai'; res.aiPending=true;
        var job=gradeShortWithAI(q, ans).then(function(sc){
          delete aiGradeJobs[q.id];
          /* res 即 s.results 中的同一引用，按引用更新，避免用户翻题后写错位置 */
          res.score=clamp(sc/100,0,1);
          res.correct=(sc>=AppState.settings.scoring.shortPass);
          res.short={score:sc, ai:true}; res.aiPending=false;
          if(AppState.session===s && !s.finished) refreshSessionArea();
        }).catch(function(){ delete aiGradeJobs[q.id]; res.aiPending=false; });
        aiGradeJobs[q.id]=job;
      }
    }
  }
  refreshSessionArea();
  saveProgress(s);
  /* 答对即自动进入下一题；答错则停留显示错因与解析（适用于所有模式：顺序/随机/模考）
     守卫：以提交时的 idx 为准，780ms 内用户手动翻页则不再自动跳 */
  if(res.correct && s.idx < s.list.length-1){
    var submittedIdx=s.idx;
    setTimeout(function(){
      if(AppState.session===s && !s.finished && s.idx===submittedIdx) nextQuestion(s);
    }, 780);
  }
}
function nextQuestion(s){
  if(s.idx >= s.list.length-1){
    if(s.mode==='exam'){ submitExam(); return; }
    finishPractice(s); return;
  }
  s.idx++;
  saveProgress(s);
  refreshSessionArea();
  window.scrollTo({top:0, behavior:'smooth'});
}
function prevQuestion(s){
  if(s.idx<=0) return;
  s.idx--; saveProgress(s); refreshSessionArea();
}
function finishPractice(s){
  var done=Object.keys(s.results).length;
  var cor=0, tot=0;
  Object.keys(s.results).forEach(function(k){ tot++; cor += s.results[k].score||0; });
  Modal.open({
    title:'本轮完成',
    body:'<div class="grid g3" style="gap:10px">'+
      statMini('已答', done)+statMini('正确', s.correct)+statMini('错误', s.wrong)+
      '</div><div class="hint mt12">学习记录已自动更新，答错题目已进入错题本并按间隔重复安排复习。</div>',
    foot:'<button class="btn" id="again">再来一轮</button><button class="btn primary" id="doneBtn">完成</button>',
    onMount: function(m){
      var a=m.querySelector('#again');
      a.onclick=function(){
        Modal.close(m);
        var list=s.list.slice();
        startSession({view:'practice', mode:s.mode, list:list, title:s.title});
      };
      m.querySelector('#doneBtn').onclick=function(){ Modal.close(m); AppState.session=null; go('home'); };
    }
  });
  s.finished=true; s.active=false;
  saveProgress(s);
  hideJumpPad();
}
/* 局部刷新题目区域 */
function refreshSessionArea(){
  var host=$('#sessArea');
  if(!host) return;
  var s=AppState.session; if(!s) return;
  host.innerHTML = sessionAreaHTML(s);
  bindQuestionArea(host, s);
  var sb2=$('#submitBtn'); if(sb2) sb2.onclick=function(){ submitCurrent(s); };
  var nb2=$('#nextBtn'); if(nb2) nb2.onclick=function(){ nextQuestion(s); };
  var pb2=$('#prevBtn'); if(pb2) pb2.onclick=function(){ prevQuestion(s); };
  var fb2=$('#flagBtn'); if(fb2) fb2.onclick=function(){ s.flags[s.idx]=!s.flags[s.idx]; refreshSessionArea(); };
  var sh2=$('#sheetBtn'); if(sh2) sh2.onclick=function(){ openAnswerSheet(s); };
  var pb=$('#sessProgress');
  if(pb) pb.style.width = ((Object.keys(s.results).length)/s.list.length*100)+'%';
  var st=$('#sessStat');
  if(st) st.innerHTML = sessionStatHTML(s);
  var ab=$('#answerSheet');
  if(ab) bindAnswerSheet(ab, s);
  if(s.finished){ hideJumpPad(); }
  else { showJumpPad('practice:'+(s.pkey||s.mode||'x'), practicePadCfg(s)); }
}
function sessionStatHTML(s){
  if(s.mode==='exam'){
    var left=Math.max(0, s.endAt-Date.now());
    return '<span class="badge '+(left<60000?'red':'')+'" id="timer">⏱ '+fmtDur(left)+'</span>'+
      '<span class="badge">已答 '+Object.keys(s.results).length+'/'+s.list.length+'</span>';
  }
  return '<span class="badge green">对 '+s.correct+'</span><span class="badge red">错 '+s.wrong+'</span>'+
    '<span class="badge">'+(s.idx+1)+'/'+s.list.length+'</span>';
}
function sessionAreaHTML(s){
  var res=s.results[s.idx];
  var h=renderQuestionArea(s);
  var last = s.idx>=s.list.length-1;
  var advLabel = last ? (s.mode==='exam'?'交卷':'完成') : '下一题 →';
  h += '<div class="row gap8 mt16 btn-row">'+
    '<button class="btn" id="prevBtn"'+(s.idx?'':' disabled')+'>上一题</button>'+
    '<span class="btn-sp"></span>'+
    (s.mode==='exam'?'<button class="btn" id="sheetBtn">答题卡</button><button class="btn" id="flagBtn">'+(s.flags[s.idx]?'★ 已标记':'☆ 标记')+'</button>':'')+
    (res
      ? '<button class="btn primary" id="nextBtn">'+advLabel+'</button>'
      : '<button class="btn primary" id="submitBtn">提交答案 <span class="kbd" style="margin-left:6px">Enter</span></button>'+
        '<button class="btn" id="nextBtn">下一题 →</button>')+
    '</div>';
  return h;
}

function buildExam(){
  var w=ExamWizard;
  var pool={};
  AppState.questions.forEach(function(q){
    if(w.banks.length && w.banks.indexOf(q.bankId)<0) return;
    if(w.types.indexOf(q.type)<0) return;
    (pool[q.type]=pool[q.type]||[]).push(q);
  });
  var sum=w.types.reduce(function(a,t){ return a+(w.ratios[t]||0); },0);
  if(!sum){ toast('请至少为一个题型分配比例'); return; }
  var paper=[];
  var remain=w.total;
  w.types.forEach(function(t, i){
    var arr=shuffle((pool[t]||[]).slice());
    var cnt = (i===w.types.length-1)? remain : Math.min(arr.length, Math.round(w.total*(w.ratios[t]||0)/sum));
    cnt=Math.max(0, Math.min(cnt, arr.length));
    paper=paper.concat(arr.slice(0,cnt));
    remain-=cnt;
  });
  /* 若仍有余量，从剩余可选题中补齐 */
  if(paper.length<w.total){
    var left=[];
    w.types.forEach(function(t){ (pool[t]||[]).forEach(function(q){ if(paper.indexOf(q)<0) left.push(q); }); });
    shuffle(left);
    paper=paper.concat(left.slice(0, Math.max(0, w.total-paper.length)));
  }
  if(!paper.length){ toast('没有可用题目'); return; }
  paper=shuffle(paper);
  AppState.session = {
    view:'exam', mode:'exam', title:'模拟考试', list:paper, idx:0, answers:{}, results:{},
    startedAt: Date.now(), endAt: Date.now()+w.duration*60000, finished:false, active:true,
    correct:0, wrong:0, flags:{}, examCfg:{duration:w.duration, ratios:JSON.parse(JSON.stringify(w.ratios))}
  };
  go('exam');
}
var timerId=null;
function startTimer(s){
  clearInterval(timerId);
  timerId=setInterval(function(){
    if(!AppState.session || AppState.session!==s || s.finished){ clearInterval(timerId); return; }
    var left=s.endAt-Date.now();
    var el=$('#timer');
    if(el){ el.textContent='⏱ '+fmtDur(Math.max(0,left)); if(left<60000) el.className='badge red'; }
    if(left<=0){ clearInterval(timerId); toast('时间到，自动交卷'); autoSubmit(s); }
  }, 1000);
}
function confirmSubmit(s){
  var un=s.list.filter(function(q,i){ return !s.results[i]; }).length;
  var msg = un? ('还有 <b>'+un+'</b> 道题未作答，未作答将记 0 分。<br>确认现在交卷吗？') : '所有题目均已作答，确认交卷？';
  confirmBox('交卷', msg, '确认交卷', function(){ submitExam(); });
}
function autoSubmit(s){
  s.list.forEach(function(q,i){ if(!s.results[i]) s.results[i]={correct:false, score:0, note:'未作答'}; });
  submitExam();
}
function submitExam(){
  var s=AppState.session;
  s.finished=true; s.active=false;
  clearInterval(timerId);
  hideJumpPad();
  /* 等待 AI 评分中的简答题完成，避免用本地旧分生成成绩单（15s 兜底防 AI 挂起卡死交卷） */
  var jobs=s.list.filter(function(q){ var r=s.results[s.list.indexOf(q)]; return r && r.aiPending && aiGradeJobs[q.id]; })
                .map(function(q){ return aiGradeJobs[q.id]; });
  var go=function(){ finishExam(s); };
  if(jobs.length){
    toast('AI 阅卷评分中，正在生成成绩单…');
    var bail=new Promise(function(res){ setTimeout(res, 15000); });
    Promise.race([Promise.all(jobs.map(function(p){ return p.catch(function(){}); })), bail]).then(go, go);
  } else go();
}
function finishExam(s){
  var total=s.list.length, got=0, correctN=0, wrongs=[];
  var byType={};
  s.list.forEach(function(q,i){
    var r=s.results[i];
    if(!r){ r={correct:false, score:0, note:'未作答'}; s.results[i]=r; }
    got += (r.score||0);
    if(r.correct) correctN++; else wrongs.push(q);
    var t=byType[q.type]||{n:0,ok:0}; t.n++; if(r.correct) t.ok++; byType[q.type]=t;
  });
  var score=Math.round(got/total*100);
  var acc=got/total;
  var duration=Date.now()-s.startedAt;
  var rec={ id:uid('ex'), date:Date.now(), score:score, accuracy:acc, total:total, correct:correctN,
            duration:duration, wrongIds:wrongs.map(function(q){ return q.id; }), byType:byType };
  AppState.exams.unshift(rec);
  DB.put('exams', rec).catch(function(){});
  var examData = {
    total: total, duration: Math.round(duration/1000), score: score,
    answers: s.list.map(function(q,i){
      return { qId:q.id, question:qTitle(q), type:q.type,
        userAnswer: fmtUserAnswer(q, s.answers[i]), correctAnswer: answerDisplay(q),
        isCorrect: !!(s.results[i] && s.results[i].correct), analysis: q.analysis||'' };
    })
  };
  var typeRows=Object.keys(byType).map(function(t){
    var b=byType[t];
    return '<tr><td>'+TYPE_NAME[t]+'</td><td>'+b.n+'</td><td>'+b.ok+'</td><td>'+Math.round(b.ok/b.n*100)+'%</td></tr>';
  }).join('');
  var body =
    '<div class="grid g4" style="gap:10px">'+
      statMini('得分', score)+statMini('正确率', Math.round(acc*100)+'%')+
      statMini('用时', fmtDur(duration))+statMini('错题', wrongs.length)+
    '</div>'+
    '<div class="mt16"><div class="label">分题型统计</div>'+
      '<table class="tbl mt4"><thead><tr><th>题型</th><th>题数</th><th>答对</th><th>正确率</th></tr></thead><tbody>'+typeRows+'</tbody></table></div>'+
    (wrongs.length?'<div class="mt16"><div class="label">错题（'+wrongs.length+'）</div>'+
      '<div style="max-height:200px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:10px">'+
      wrongs.slice(0,60).map(function(q,i){
        return '<div class="small" data-wq="'+q.id+'" style="padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer">'+
          '<span class="badge">'+TYPE_SHORT[q.type]+'</span> '+esc(qTitle(q).slice(0,60))+'</div>';
      }).join('')+'</div></div>':'<div class="mt16 center" style="padding:14px"><div style="font-size:28px">🎯</div><div class="strong mt8">全部正确，完美！</div></div>');
  Modal.open({
    title:'成绩报告单',
    sub: new Date().toLocaleString('zh-CN'),
    body: body,
    foot: (llmConfigured()?'<button class="btn" id="aiReview">✨ AI 复盘</button>':'')+
      '<button class="btn" id="noImp">不导入</button>'+(wrongs.length?'<button class="btn primary" id="imp">一键导入错题本</button>':'<button class="btn primary" data-close>完成</button>'),
    onMount: function(m){
      m.querySelectorAll('[data-wq]').forEach(function(el){
        el.onclick=function(){ openQuestionDetail(AppState.qMap.get(el.getAttribute('data-wq'))); };
      });
      var ar=m.querySelector('#aiReview');
      if(ar) ar.onclick=function(){ openExamReview(examData, m); };
      var imp=m.querySelector('#imp');
      if(imp) imp.onclick=function(){
        /* 只把答错的题计入 SRS/错题本；答对题不动学习记录，避免污染间隔重复调度 */
        var n=0;
        s.list.forEach(function(q,i){
          var r=s.results[i];
          if(r && r.correct===false){ updateStat(q.id, false, 1); n++; }
        });
        dailyAdd(n);
        Modal.close(m); toast('已导入 '+n+' 道错题'); AppState.session=null; render();
      };
      var no=m.querySelector('#noImp');
      if(no) no.onclick=function(){ Modal.close(m); AppState.session=null; render(); };
    }
  });
}

var CardMode = null;
function startCardMode(list, title, resumeKey){
  if(!list || !list.length){ toast('没有可背的题目'); return; }
  var sorted = sortByStudyOrder(list.slice());
  var key = resumeKey ? ('card:'+resumeKey) : null;   /* 续背键：按题库/来源区分 */
  function openAt(idx){
    CardMode = { list: sorted, i: Math.min(Math.max(0, idx|0), sorted.length-1), phase:'q', key: key };
    var mask=Modal.open({
      title: title||'背题模式',
      body:'<div id="cardWrap"></div>',
      foot:'<button class="btn" id="cPrev">上一题</button><button class="btn primary" id="cOk">记住了</button>',
      onMount: function(m){
        CardMode.mask=m;
        m.querySelector('#cPrev').onclick=function(){ CardMode.i=(CardMode.i-1+CardMode.list.length)%CardMode.list.length; CardMode.phase='q'; drawCard(); };
        m.querySelector('#cOk').onclick=function(){
          var q=CardMode.list[CardMode.i];
          updateStat(q.id, true, 5); dailyAdd(1);
          toast('已记录掌握');
          CardMode.i=(CardMode.i+1)%CardMode.list.length; CardMode.phase='q'; drawCard();
        };
        drawCard();
        showJumpPad('card', {
          count: CardMode.list.length,
          getIdx: function(){ return CardMode? CardMode.i : 0; },
          onJump: function(i){ if(!CardMode) return; CardMode.i=i; CardMode.phase='q'; drawCard(); }
        });
      },
      onClose: function(){
        CardMode=null; hideJumpPad();
        if(AppState.view==='practice' && AppState.session && !AppState.session.finished) reShowPracticePad();
      }
    });
    mask.addEventListener('click', function(e){ if(e.target===mask) CardMode=null; });
  }
  /* 续背：读取上次题号（本地库足够快，异步无感） */
  if(key){
    DB.get('progress', key).then(function(r){ openAt(r && typeof r.idx==='number' ? r.idx : 0); })
      .catch(function(){ openAt(0); });
  } else {
    openAt(0);
  }
}
/* 持久化当前题号，支持退出后/返回后从同一题续背 */
function saveCardProgress(){
  if(!CardMode || !CardMode.key) return;
  try{ DB.put('progress', { key: CardMode.key, mode:'card', title:'背题模式', idx: CardMode.i, updatedAt: Date.now() }); }catch(e){}
}
/* 背题点击流转：题目 → 答案 → 下一题 → 答案 … */
function tapCard(){
  if(!CardMode) return;
  if(CardMode.phase==='q'){ CardMode.phase='a'; }
  else { CardMode.i=(CardMode.i+1)%CardMode.list.length; CardMode.phase='q'; }
  drawCard();
}
function drawCard(){
  if(!CardMode || !CardMode.mask) return;
  var q=CardMode.list[CardMode.i], s=AppState.stats.get(q.id)||{};
  var front='<div class="fq">'+highlightBlanks(q.question, q.type==='fill')+'</div>';
  if(q.options && q.options.length){
    front += '<div class="mt16">'+q.options.map(function(o,i){
      return '<div class="small" style="padding:5px 0;color:var(--sub)">'+String.fromCharCode(65+i)+'. '+esc(o)+'</div>';
    }).join('')+'</div>';
  }
  var answer='';
  if(CardMode.phase==='a'){
    answer='<div class="card-answer">'+
      '<div class="label" style="color:var(--blue)">参考答案</div>'+
      '<div class="fa mt8">'+esc(answerDisplay(q))+'</div>'+
      (q.analysis?'<div class="small mt12" style="line-height:1.8;color:var(--sub)">'+nl2br(q.analysis)+'</div>':'')+
      '<div class="tiny muted mt12">记忆提示：'+mnemonicTip(q)+'</div></div>';

/* LLM 调用（外层）：自动重试过载/网络错误（默认 2 次，指数退避），重试过程通过 opts.onRetry 通知 UI */
function llmCall(userContent, opts){
  opts=opts||{};
  var maxRetry=(opts.maxRetry!=null)? opts.maxRetry : 2;
  function attempt(n){
    return llmCallOnce(userContent, opts).catch(function(e){
      if(e && e.retriable && n<maxRetry){
        if(opts.onRetry) opts.onRetry(n+1, maxRetry, e.message||'');
        var delay = e.retryAfter>0 ? Math.min(8000, e.retryAfter*1000) : Math.min(8000, 1100*Math.pow(2,n)+Math.random()*400);
        return new Promise(function(res){ setTimeout(res, delay); }).then(function(){ return attempt(n+1); });
      }
      throw e;
    });
  }
  return attempt(0);
}
function llmCallOnce(userContent, opts){
  opts=opts||{};
  var c=AppState.settings.llm;
  var base=(c.baseUrl||'https://api.openai.com/v1').replace(/\/+$/,'');
  var maxTok = Math.max(256, Math.min(2048, Math.floor((c.contextWindow||8192)/4)));
  var url, headers, body;
  if(c.protocol==='anthropic'){
    url=base+'/messages';
    headers={'content-type':'application/json','x-api-key':c.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
    body={ model:c.model, max_tokens:maxTok, temperature:Number(c.temperature)||0.3, system:SYS_PROMPT,
           stream:!!opts.onChunk, messages:[{role:'user', content:userContent}] };
  }else{
    url=base+'/chat/completions';
    headers={'content-type':'application/json','Authorization':'Bearer '+c.apiKey};
    body={ model:c.model, temperature:Number(c.temperature)||0.3, max_tokens:maxTok, stream:!!opts.onChunk,
           messages:[{role:'system', content:SYS_PROMPT},{role:'user', content:userContent}] };
  }
  /* 可选代理：支持 {url} 占位符，或 ?url= 追加（常见 CORS 代理格式） */
  var proxy=String(c.proxyUrl||'').trim();
  if(proxy){ url = proxy.indexOf('{url}')>=0 ? proxy.replace('{url}', encodeURIComponent(url))
              : proxy+(proxy.indexOf('?')>=0?'&':'?')+'url='+encodeURIComponent(url); }
  var tag=opts.tag||'其他', t0=Date.now();
  return fetch(url, {method:'POST', headers:headers, body:JSON.stringify(body), signal:opts.signal}).then(function(r){
    if(!r.ok){
      return r.text().then(function(t){
        var d=null; try{ d=JSON.parse(t); }catch(e){}
        var err=new Error((d && d.error && (d.error.message||d.error)) || ('HTTP '+r.status));
        /* 过载/限流/服务端错误 → 自动重试；参数与鉴权错误不重试 */
        err.retriable = (r.status===429 || r.status===408 || r.status>=500);
        var ra=parseInt(r.headers && r.headers.get ? (r.headers.get('retry-after')||'0') : '0', 10);
        if(ra>0) err.retryAfter=ra;
        throw err;
      });
    }
    if(opts.onChunk && r.body && r.body.getReader){
      /* 流式：SSE 逐块读取，onChunk(累计文本, 本次增量) */
      var reader=r.body.getReader(), dec=new TextDecoder('utf-8'), buf='', full='';
      function pump(){
        return reader.read().then(function(x){
          if(x.done) return full;
          buf+=dec.decode(x.value, {stream:true});
          var frames=buf.split(/\n\n/); buf=frames.pop()||'';
          frames.forEach(function(fr){
            fr.split(/\n/).forEach(function(line){
              line=line.trim();
              if(line.indexOf('data:')!==0) return;
              var pl=line.slice(5).trim();
              if(pl==='[DONE]') return;
              var j=null; try{ j=JSON.parse(pl); }catch(e){ return; }
              var delta='';
              if(j.choices && j.choices[0]){ var d0=j.choices[0].delta||j.choices[0].message||{}; delta=d0.content||''; }
              else if(j.type==='content_block_delta' && j.delta) delta=j.delta.text||'';
              if(delta){ full+=delta; opts.onChunk(full, delta); }
            });
          });
          return pump();
        });
      }
      return pump().then(function(full2){
        recordAiUsage(tag, estTokens(userContent), estTokens(full2));
        return String(full2||'').trim();
      });
    }
    /* 非流式（回退批量模式） */
    return r.text().then(function(t){
      var data; try{ data=JSON.parse(t); }catch(e){ throw new Error('响应解析失败：'+t.slice(0,120)); }
      var txt='';
      if(data.choices && data.choices[0] && data.choices[0].message) txt=data.choices[0].message.content;
      else if(data.content && data.content[0]) txt=data.content[0].text;
      else if(data.output_text) txt=data.output_text;
      else txt=JSON.stringify(data).slice(0,400);
      recordAiUsage(tag, estTokens(userContent), estTokens(txt));
      return String(txt||'').trim();
    });
  }).catch(function(e){
    if(e && e.name==='AbortError') throw e;
    if(e && e.retriable===undefined && /failed to fetch|networkerror|load failed/i.test(String(e && e.message || e))){
      e.retriable=true;   /* 网络层错误：尚未输出任何内容，重试安全 */
    }
    var msg=(e && e.message)||String(e);
    if(/failed to fetch|networkerror|load failed|fetch/i.test(msg)){
      toast('浏览器不允许直连大模型，请在设置中配置「代理地址」');
      throw new Error('网络请求失败（多为浏览器跨域直连限制）。请在设置「大模型接入」中配置代理地址后重试。');
    }
    throw e instanceof Error? e : new Error(msg);
  });
}
function parseAI(text){
  var t=String(text||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  var out={a:'', b:'', c:''};
  if(t.charAt(0)==='{' || t.charAt(0)==='['){
    try{
      var o=JSON.parse(t);
      if(Array.isArray(o)) o=o[0]||{};
      var keys=Object.keys(o);
      function find(re){ for(var i=0;i<keys.length;i++){ if(re.test(keys[i])) return o[keys[i]]; } return ''; }
      out.a=String(find(/错因|为什么错|错误原因|原因/)||'');
      out.b=String(find(/正确|为什么对|答案解析|解析/)||'');
      out.c=String(find(/口诀|记忆|要点|技巧/)||'');
      if(out.a||out.b||out.c) return out;
    }catch(e){}
  }
  /* 纯文本容错：按小标题切分 */
  var lines=t.split(/\n+/), cur='a';
  lines.forEach(function(line){
    var s=line.trim(); if(!s) return;
    if(/^[{【]?\s*(一|1|①|1\)|【)?\s*(错因|错误原因|为什么错|用户答案)/.test(s) || /错因分析/.test(s)) { cur='a'; s=s.replace(/^[^：:]*[：:]/,''); }
    else if(/正确答案|为什么对|解析|二|2\)|②/.test(s) && cur==='a'){ cur='b'; s=s.replace(/^[^：:]*[：:]/,''); }
    else if(/口诀|记忆|要点|三|3\)|③/.test(s)){ cur='c'; s=s.replace(/^[^：:]*[：:]/,''); }
    out[cur] += (out[cur]?' ':'') + s;
  });
  if(!out.a && !out.b && !out.c) out.a=t;
  return out;
}
function llmExplain(q, userAnswer, slot, btn){

var SYS_PROMPT_GRADE = '你是一名严谨的铁路考试阅卷老师。请依据【标准答案】对学生【作答】进行评分：踩点给分，覆盖关键词、核心要点与表述准确性；与标准答案意思一致即可给分，明显遗漏或错误则相应扣减。只输出一个 JSON：{"score": 0到100的整数, "reason": "简短给分理由（≤40字）"}，不要输出其他任何内容。';
function gradeShortWithAI(q, userAns){

/* ---------- 流式渲染：打字机 + 中途停止 ---------- */
function makeTyper(el){
  /* 每 20ms 输出一批字符；积压越多加速，保证长文也能及时追上流 */
  var buf='', done=false, started=false;
  function tick(){
    if(done && !buf.length) return;
    if(buf.length){
      var n=Math.max(1, Math.ceil(buf.length/40));
      el.textContent += buf.slice(0,n);
      buf=buf.slice(n);
    }
    setTimeout(tick, 20);
  }
  return {
    push:function(s){ buf+=s; if(!started){ started=true; tick(); } },
    end:function(){ done=true; },
    text:function(){ return el.textContent; }
  };
}

        (rows? '<div class="au-div"></div>'+rows : '<div class="au-row"><span colspan="2" class="tiny muted">暂无功能用量明细</span></div>');
    }
  };
}

function parseAIJSON(text){
  var t=String(text||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'');
  try{ return JSON.parse(t); }catch(e){}
  var m=t.match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  m=t.match(/\[[\s\S]*\]/); if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  return null;
}

/* ---------- 功能二：智能加练（AI 选题） ---------- */
function buildWeakPoints(){
  var m={}; wrongList().forEach(function(q){ var k=(q.category||'未分类')+' · '+TYPE_NAME[q.type]; m[k]=(m[k]||0)+1; });
  return Object.keys(m).map(function(k){ return {k:k, n:m[k]}; }).sort(function(a,b){ return b.n-a.n; }).slice(0,5)
    .map(function(x){ return x.k+' 错 '+x.n+' 次'; });
}
/* 隐私最小化：只取错得最多的 3 个章节的题目子集发给 AI（而非整个题库） */
function topWeakCategories(){
  var m={}; wrongList().forEach(function(q){ var k=q.category||'未分类'; m[k]=(m[k]||0)+1; });
  return Object.keys(m).map(function(k){ return {k:k, n:m[k]}; }).sort(function(a,b){ return b.n-a.n; }).slice(0,3).map(function(x){ return x.k; });
}
function buildWeakPool(){
  var cats=topWeakCategories();
  if(!cats.length) return null;                       /* 无错题 → 不发 AI */
  var pool=AppState.questions.filter(function(q){ return cats.indexOf(q.category||'未分类')>=0; });
  return pool.slice(0, 200);                          /* 子集过大时截断，防 token 爆炸 */
}
function buildDrillPrompt(weakLines, reqText, count, byWrong, pool){
  var cats=topWeakCategories();
  var scope = (pool && cats.length)? '以下题目子集（来自你错得最多的 '+cats.length+' 个章节：'+cats.join('、')+'）' : '以下题库';
  return '你是一名题库出题专家。请从'+scope+'中选择题目来组一份针对用户的专项加练卷。\n\n'+
    '【用户薄弱点】\n'+(weakLines.length? weakLines.join('\n') : '（暂无错题记录，请按题型均衡选题）')+'\n\n'+
    '【题型和数量要求】\n'+reqText+'\n\n'+
    '【题库数据】\n'+JSON.stringify((pool||AppState.questions).map(function(q){
      return {id:q.id, question:qTitle(q), type:q.type, category:q.category||'未分类', answer:q.answer, analysis:q.analysis||''};
    }))+'\n\n'+
    '【要求】\n从题库中选出最适合用户当前薄弱点的题目，生成一组 JSON：[{"id": 题ID, "reason": "为什么选这道题"}, ...]\n'+
    '注意：只选题库中已有的题目ID，不要编造新题。总题数必须等于用户设置的题数（'+count+' 题）。'+(byWrong? '\n优先选择用户错得最多的知识点对应的题目。':'');
}
function normalizeDrill(arr, count, types){
  var seen={}, out=[];
  if(Array.isArray(arr)) arr.forEach(function(x){ if(x && AppState.qMap.has(x.id) && !seen[x.id]){ seen[x.id]=1; out.push({id:x.id, reason:x.reason||''}); } });
  if(out.length<count){
    var pool=shuffle(AppState.questions.filter(function(q){ return !seen[q.id] && (!types.length||types.indexOf(q.type)>=0); }).slice());
    for(var i=0;i<pool.length && out.length<count;i++){ out.push({id:pool[i].id, reason:'补充题（保持题量）'}); }
  }
  return out.slice(0, count);
}
function drillFallback(byWrong, types, count){
  var base = byWrong? wrongList() : AppState.questions.slice();
  if(!base.length) base=AppState.questions.slice();
  var pool=base.filter(function(q){ return !types.length||types.indexOf(q.type)>=0; });
  if(!pool.length) pool=base;
  return shuffle(pool.slice()).slice(0, count).map(function(q){ return {id:q.id, reason: byWrong?'你曾答错的题目':'随机抽题'}; });
}
function showDrillConfirm(list){
  if(!list.length){ toast('没有可选题目'); return; }
  Modal.open({ title:'AI 推荐加练', sub:'共 '+list.length+' 题',

        return '<div class="weak-item"><span>'+esc(q?qTitle(q).slice(0,52):('ID '+x.id))+'</span><span class="tiny muted" style="flex:none;max-width:46%">'+esc(x.reason||'')+'</span></div>';
      }).join('')+(list.length>8?'<div class="tiny muted mt8">…等共 '+list.length+' 题</div>':'')+'</div>',
    foot:'<button class="btn" data-close>取消</button><button class="btn primary" id="startDrill">开始加练</button>',
    onMount:function(m){ m.querySelector('#startDrill').onclick=function(){
      var qs=list.map(function(x){ return AppState.qMap.get(x.id); }).filter(Boolean);
      Modal.close(m);

      startSession({view:'practice', mode:'practice', list:qs, title:'智能加练'});
    }; }
  });

function generateDrill(types, count, diff){
  var byWrong = diff==='wrong';
  var per={}, idx=0;
  for(var k=0;k<count;k++){ var t=types[idx%types.length]; per[t]=(per[t]||0)+1; idx++; }
  var reqText = types.map(function(t){ return TYPE_NAME[t]+' '+per[t]+' 题'; }).join('、');
  var pool=buildWeakPool();
  if(!pool){
    /* 无错题 → 无薄弱点可分析，直接本地随机抽题（不发送任何数据给 AI） */
    var fb=drillFallback(byWrong, types, count);
    if(!wrongList().length) toast('暂无错题记录，已直接随机抽题（未调用 AI）');
    showDrillConfirm(fb); return;
  }
  var prompt = buildDrillPrompt(buildWeakPoints(), reqText, count, byWrong, pool);
  var mask=Modal.open({ title:'智能加练', sub:'AI 正在为你选题…（仅发送薄弱章节子集）', body:'<div class="ai-box"><div class="ai-sec"><span class="spinner"></span> AI 正在组卷<span class="dots"></span></div></div>', foot:'<button class="btn" data-close>关闭</button>' });
  var timeout=new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('AI 选题超时（>25s），已回退随机抽题')); }, 25000); });
  Promise.race([llmCall(prompt, {tag:'智能加练'}), timeout]).then(function(txt){
    var arr=parseAIJSON(txt);
    var list=normalizeDrill(arr, count, types);
    if(!list.length) list=drillFallback(byWrong, types, count);
    Modal.close(mask); showDrillConfirm(list);
  }).catch(function(e){
    var list=drillFallback(byWrong, types, count);
    Modal.close(mask); toast('AI 选题失败，已回退随机：'+(e.message||e)); showDrillConfirm(list);
  });
}

  Modal.open({ title:'智能加练', body:body, foot:'<button class="btn" data-close>取消</button><button class="btn primary" id="drillGo">生成加练卷</button>',

        var types=Array.prototype.slice.call(m.querySelectorAll('#drillTypes .chip.active')).map(function(c){ return c.getAttribute('data-t'); });

        var count=clamp(parseInt(m.querySelector('#drillCount').value,10)||5, 1, 50);

        Modal.close(m); generateDrill(types, count, diff);
      };
    }
  });
}

/* ---------- 功能：通过率预测 ---------- */
function collectExamReadiness(){
  var ws=wrongList(), now=Date.now(), week=now-7*86400000;
  var recentWrong=0, unmastered=0, due=dueList().length;
  var byType={};
  AppState.stats.forEach(function(s){
    if(s.lastWrongTime && s.lastWrongTime>=week) recentWrong++;
    if(s.mastered) return;
    var q=AppState.qMap.get(s.qid); if(!q) return;
    unmastered++;
    var t=byType[q.type]||{n:0,ok:0}; t.n+=s.totalCount; t.ok+=s.correctCount; byType[q.type]=t;
  });
  var typeAcc=Object.keys(byType).map(function(t){
    var b=byType[t];
    return {type:t, name:TYPE_NAME[t]||t, total:b.n, correct:b.ok, acc:b.n? Math.round(b.ok/b.n*100):0};
  });
  var lastExam=AppState.exams[0]||null;
  return {
    totalWrong: ws.length,
    recentWrong7d: recentWrong,
    unmastered: unmastered,
    dueCount: due,
    dueRate: unmastered? Math.round(due/unmastered*100):0,
    typeAcc: typeAcc,
    lastExam: lastExam? {score:lastExam.score, accuracy:Math.round(lastExam.accuracy*100), total:lastExam.total, agoDays:Math.round((now-lastExam.date)/86400000)} : null
  };
}
function buildPassRatePrompt(d){
  return '你是一名资深铁路考试培训顾问。请基于以下学习数据，预测用户通过正式考试的可能性，并给出详细的改进计划。\n\n'+
    '【学习数据】\n'+JSON.stringify(d)+'\n\n'+
    '【要求】\n1. 预测通过率（0-100 的整数百分比）与置信度（高/中/低）\n2. 给出至少 3 条详细改进建议\n'+
    '3. 若预测通过率低于 60%，额外给出一个可执行的冲刺计划（未来 1-2 周，每天复习内容与目标）\n'+
    '4. 输出为 JSON：{ "passRate": 数字, "confidence": "高|中|低", "reason": "一句话判断依据", "suggestions": ["建议1","建议2","建议3", ...], "sprint": { "title": "冲刺计划标题", "plan": ["第1天：…", "第2天：…"] } }\n'+

function renderPassRateReport(json, d){

        '<div class="pass-track"><div class="pass-fill" style="width:'+rate+'%"></div></div>'+

/* ---------- 功能：学习周报 ---------- */
function weekRange(offset){
  /* offset=0 本周（周一为起点）；返回 [startTs, endTs) */
  var now=new Date(); now.setHours(0,0,0,0);
  now.setDate(now.getDate()-((now.getDay()+6)%7) - offset*7);
  return [now.getTime(), now.getTime()+7*86400000];
}
function collectWeekData(){
  function agg(offset){
    var r=weekRange(offset), done=0, wrong=0, days=[];
    for(var i=0;i<7;i++){
      var d=new Date(r[0]+i*86400000), k=dateKey(d), x=AppState.dailyHist[k];
      days.push({date:k, done:x?x.done:0, wrong:x?x.wrong:0});
      done+=x?x.done:0; wrong+=x?x.wrong:0;
    }
    var newWeak=0;
    AppState.stats.forEach(function(s){ if(s.lastWrongTime && s.lastWrongTime>=r[0] && s.lastWrongTime<r[1]) newWeak++; });
    var exams=AppState.exams.filter(function(e){ return e.date>=r[0] && e.date<r[1]; });
    var examAvg=exams.length? Math.round(exams.reduce(function(a,e){ return a+e.score; },0)/exams.length) : null;
    return { days:days, done:done, wrong:wrong,
      acc: done? Math.round((done-wrong)/done*100) : 0,
      newWeak:newWeak, examCount:exams.length, examAvg:examAvg };
  }
  return { thisWeek:agg(0), lastWeek:agg(1),
    dueNow:dueList().length, totalWrong:wrongList().length, mastered:masteredCount() };
}

    '【考试数据】\n题目总数：'+d.total+'，用时：'+d.duration+' 秒，得分：'+d.score+' 分\n\n'+

    '【要求】\n1. 整体评价：正确率、用时是否合理\n2. 错误集中区：哪些章节/题型错误最多，为什么\n3. 失分点分析：简答题丢分在哪（关键词/相似度/完整度）\n4. 下次考试策略：3-5 条可执行建议\n'+
    '5. 输出为 JSON：{ "overall": "整体评价", "weakAreas": [{ "area": "区域名", "wrongCount": 错误数, "reason": "原因" }], "scoreLossPoints": [{ "question": "题目摘要", "lossReason": "为什么丢分" }], "strategy": ["建议1", "建议2", ...] }';

function renderReviewReport(json){
  var h='', i;
  if(json.overall) h += '<div class="ai-sec"><h3 class="rh">📝 整体评价</h3>'+(json.score!=null?'<div class="rh-sub">得分 '+json.score+' 分</div>':'')+nl2br(json.overall)+'</div>';
  var wa=Array.isArray(json.weakAreas)? json.weakAreas : [];
  if(wa.length){ h += '<div class="ai-sec"><h3 class="rh">⚠️ 错误集中区</h3>';
    for(i=0;i<wa.length;i++){ h += '<div class="weak-item"><div style="flex:1"><div>'+esc(wa[i].area||'')+'</div>'+(wa[i].reason?'<div class="tiny muted mt4">'+esc(wa[i].reason)+'</div>':'')+'</div><span class="wcnt">错 '+(wa[i].wrongCount||0)+'</span></div>'; }
    h += '</div>'; }
  var sl=Array.isArray(json.scoreLossPoints)? json.scoreLossPoints : [];
  if(sl.length){ h += '<div class="ai-sec"><h3 class="rh">🩹 失分点分析</h3>';
    for(i=0;i<sl.length;i++){ h += '<div class="weak-item" style="display:block"><div class="small">'+esc(sl[i].question||'')+'</div>'+(sl[i].lossReason?'<div class="tiny muted mt4">'+esc(sl[i].lossReason)+'</div>':'')+'</div>'; }
    h += '</div>'; }

function buildFollowPrompt(ctx, v){

    '用户问：「'+v+'」\n请基于已有讲解，用通俗语言回答用户的追问。不要重复已讲过的内容。保持简洁，200 字以内。';

function renderConvo(listEl, turns){
  listEl.innerHTML = turns.map(function(t){
    return '<div class="conv conv-u"><b>你：</b>'+esc(t.user)+'</div><div class="conv conv-a">'+nl2br(t.assistant)+'</div>';
  }).join('');
  listEl.scrollTop = listEl.scrollHeight;
}
function attachFollowUp(slot, q, userAnswer, txt){
  if(!llmConfigured()) return;
  var cid=q.id;
  if(!aiConvoMap[cid]) aiConvoMap[cid]={ q:q, userAnswer:userAnswer, explain:txt, turns:[] };
  else { aiConvoMap[cid].explain=txt; aiConvoMap[cid].userAnswer=userAnswer; }
  var box=document.createElement('div'); box.className='ai-sec ai-followup';
  box.innerHTML='<div class="row between"><div class="strong small">💬 继续追问</div><span class="tiny muted">基于本次讲解</span></div>'+
    '<div id="convoList" class="mt8"></div>'+
    '<div class="row gap8 mt8"><input class="input" id="followQ" placeholder="还有疑问？回车发送…"><button class="btn sm primary" id="followSend">发送</button></div>'+
    '<div class="tiny muted mt4">Enter 发送 · Esc 清空</div>';
  slot.appendChild(box);
  var listEl=box.querySelector('#convoList'), input=box.querySelector('#followQ'), send=box.querySelector('#followSend');
  renderConvo(listEl, aiConvoMap[cid].turns);
  function doSend(){
    var v=input.value.trim(); if(!v) return;
    input.value=''; input.disabled=true; send.disabled=true;
    var ctx=aiConvoMap[cid];
    var sp=document.createElement('div'); sp.className='conv conv-a';
    sp.innerHTML='<span class="spinner"></span> ';
    var spTxt=document.createElement('span'); sp.appendChild(spTxt);
    listEl.appendChild(sp); listEl.scrollTop=listEl.scrollHeight;
    var typer=makeTyper(spTxt);
    var ctrl=(typeof AbortController!=='undefined')? new AbortController() : null;
    llmCall(buildFollowPrompt(ctx, v), {tag:'追问', signal:ctrl?ctrl.signal:undefined, onChunk:function(full){
      typer.push(full.slice(typer.text().length));
      listEl.scrollTop=listEl.scrollHeight;
    }}).then(function(r){
      typer.end(); sp.remove();
      ctx.turns.push({user:v, assistant:r}); renderConvo(listEl, ctx.turns);
      input.disabled=false; send.disabled=false; input.focus();
    }).catch(function(e){
      typer.end(); sp.remove();
      var err=document.createElement('div'); err.className='tiny'; err.style.color='var(--red)';
      err.textContent=(e&&e.name==='AbortError')?'已停止本次回答。':('追问失败：'+(e.message||e));
      listEl.appendChild(err); input.disabled=false; send.disabled=false; input.focus();
    });
  }
  send.onclick=doSend;
  input.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); doSend(); }
    else if(e.key==='Escape'){ input.value=''; input.blur(); }
  });
}

      '<div class="row gap12" style="align-items:center">'+
        '<img src="icon-192.png" width="56" height="56" style="border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.12)" alt="">'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-weight:600">刷题 · 铁路安全记忆</div>'+
          '<div class="small muted" id="pwaStatus">检测中…</div>'+
        '</div>'+
        '<button class="btn primary" id="installBtn" style="display:none">添加到桌面</button>'+
      '</div>'+
      '<div class="hint mt8">使用浏览器菜单中的「添加到主屏幕」也会按名称「刷题」与上面的图标安装。安装后将以全屏方式运行，可离线启动。</div>'+
    '</div>'+

    '<div class="card mt16"><div class="h3">数据管理</div>'+
      '<div class="small muted">题库 '+AppState.banks.length+' 个 · 题目 '+AppState.questions.length+' 道 · 学习记录 '+AppState.stats.size+' 条 · 模考 '+AppState.exams.length+' 次</div>'+
      '<div class="row gap8 mt12" style="flex-wrap:wrap"><button class="btn" id="exp2">导出 JSON 备份</button><button class="btn" id="imp2">恢复备份</button>'+
      '<button class="btn" id="wipeLearn">清空学习记录</button>'+
      '<button class="btn danger" id="wipe2">清空全部数据</button></div>'+
      '<div class="hint mt8">数据全部保存在本机浏览器 IndexedDB 中，清理浏览器数据会一并清除，请定期导出备份。</div>'+
    '</div>'+
    '<div class="center tiny muted mt24">铁路安全与铁路信息 · 智能刷题与辅助记忆 · 单文件离线版</div>';
  },
  mount: function(root){
    var s=AppState.settings;
    var sbk=$('#setBackBtn');
    if(sbk) sbk.onclick=function(){ go('home'); };
    root.querySelectorAll('[data-set]').forEach(function(el){
      var path=el.getAttribute('data-set'), isRange=el.type==='range';
      el.addEventListener(isRange?'input':'change', function(){
        var v = el.type==='checkbox'? el.checked : (isRange? Number(el.value) : el.value);
        setPath(s, path, v);
        saveSettings();
        updateLabels();
      });
    });
    function updateLabels(){
      var map={tTv:'llm.temperature', prV:'scoring.partialRatio', spV:'scoring.shortPass', wkV:'scoring.wKeyword',
               wsV:'scoring.wSimilarity', wlV:'scoring.wLength', gcV:'srs.graduateCount', miV:'srs.maxInterval', dgV:'ui.dailyGoal'};
      Object.keys(map).forEach(function(id){
        var el=root.querySelector('#'+id); if(!el) return;
        var v = map[id].split('.').reduce(function(o,k){ return o[k]; }, s);
        el.textContent = (map[id]==='scoring.partialRatio')? Math.round(v*100)+'%' : v;
      });
    }
    updateLabels();
    var eb=root.querySelector('#eyeBtn');
    if(eb) eb.onclick=function(){
      var i=root.querySelector('[data-set="llm.apiKey"]');
      i.type = i.type==='password'? 'text':'password';
      eb.textContent = i.type==='password'?'显示':'隐藏';
    };
    var ub=root.querySelector('#usageBtn');
    if(ub) ub.onclick=openUsageStats;
    var tb=root.querySelector('#testBtn'), tt=root.querySelector('#testTip');
    if(tb) tb.onclick=function(){
      if(!llmConfigured()){ tt.textContent='请先填写 API Key 与模型'; tt.style.color='var(--red)'; return; }
      tb.disabled=true; tb.innerHTML='<span class="spinner"></span> 测试中'; tt.textContent='';
      llmCall('请只回复两个字：正常', {tag:'测试连接'}).then(function(txt){
        tb.disabled=false; tb.textContent='测试连接';
        tt.textContent='✓ 连接成功：'+String(txt).slice(0,40); tt.style.color='#1E9E45';
      }).catch(function(e){
        tb.disabled=false; tb.textContent='测试连接';
        tt.textContent='✕ '+(e.message||e); tt.style.color='var(--red)';
      });
    };
    var e2=root.querySelector('#exp2'); if(e2) e2.onclick=exportBackup;
    var i2=root.querySelector('#imp2'); if(i2) i2.onclick=importBackup;
    var wl=root.querySelector('#wipeLearn');
    if(wl) wl.onclick=function(){
      confirmBox('清空学习记录',
        '将清空：<b>错题本、学习记录、模考成绩、练习进度、学习周报、今日与历史统计、AI 用量记录</b>。<br>'+
        '保留：<b>题库</b>、<b>AI 配置</b>与全部偏好设置。清空后即恢复到刚导入题库、配置完 AI 时的干净状态，此操作不可撤销。',
        '确认清空', resetLearningData, true);
    };

    // PWA 桌面安装按钮
    (function(){
      var btn = root.querySelector('#installBtn');
      var tip = root.querySelector('#pwaStatus');
      function refresh(){
        if(!btn || !tip) return;
        // 已在 standalone/fullscreen 中
        var standalone = window.matchMedia('(display-mode: standalone)').matches
                      || window.matchMedia('(display-mode: fullscreen)').matches
                      || window.navigator.standalone === true;
        if(standalone){
          tip.textContent = '✓ 已以全屏模式安装到桌面';
          btn.style.display = 'none';
          return;
        }
        if(window.__deferredInstall){
          tip.textContent = '可安装到桌面 / 添加到主屏幕（名称：刷题）';
          btn.style.display = '';
        } else {
          tip.innerHTML = '请用浏览器菜单 <b>添加到主屏幕</b> / <b>安装应用</b>（会自动显示「刷题」图标）';
          btn.style.display = 'none';
        }
      }
      if(btn){
        btn.onclick = function(){
          var ev = window.__deferredInstall;
          if(!ev) return;
          btn.disabled = true; btn.textContent = '安装中…';
          ev.prompt();
          ev.userChoice.then(function(r){
            btn.disabled = false; btn.textContent = '添加到桌面';
            if(r && r.outcome === 'accepted'){ tip.textContent = '正在安装…'; }
            window.__deferredInstall = null;
            setTimeout(refresh, 400);
          }).catch(function(){ btn.disabled=false; btn.textContent='添加到桌面'; });
        };
      }
      document.addEventListener('pwa-installable', refresh);
      document.addEventListener('pwa-installed', refresh);
      window.addEventListener('appinstalled', refresh);
      refresh();
    })();

    var w2=root.querySelector('#wipe2');
    if(w2) w2.onclick=function(){
      confirmBox('清空全部数据','将删除所有题库、题目、学习进度与模考记录（设置保留）。','确认清空', function(){
        DB.wipe().then(function(){
          AppState.banks=[]; AppState.questions=[]; AppState.qMap=new Map(); AppState.bankMap=new Map();
          AppState.stats=new Map(); AppState.exams=[]; render(); toast('已清空');
        });
      }, true);
    };
  }
};
function fld(label, path, val, hint){

/* ============================================================
 * 22. 全局键盘快捷键
 * ========================================================== */
document.addEventListener('keydown', function(e){
  var ae=document.activeElement, tag=ae?ae.tagName:'';
  var typing = (tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT');
  /* 背题模式 */
  if(CardMode && CardMode.mask && document.body.contains(CardMode.mask)){
    if(e.key===' '){ e.preventDefault(); tapCard(); return; }
    if(e.key==='ArrowRight'){ CardMode.i=(CardMode.i+1)%CardMode.list.length; CardMode.phase='q'; drawCard(); return; }
    if(e.key==='ArrowLeft'){ CardMode.i=(CardMode.i-1+CardMode.list.length)%CardMode.list.length; CardMode.phase='q'; drawCard(); return; }
    if(e.key==='1'){ var q=CardMode.list[CardMode.i]; updateStat(q.id,true,5); dailyAdd(1); toast('已记录掌握'); CardMode.i=(CardMode.i+1)%CardMode.list.length; CardMode.phase='q'; drawCard(); return; }
  }
  if($('#modalRoot').children.length && e.key==='Escape'){
    var lastM=$('#modalRoot').lastElementChild;
    if(lastM) Modal.close(lastM);   /* 触发 onClose（背题模式会收起跳转面板） */
    CardMode=null;
    return;
  }
  var s=AppState.session;
  if(!s || !s.active || s.finished) return;
  if(e.key==='Escape') return;
  if(typing && e.key!=='Enter') return;
  var q=curQ(s);
  if(/^[1-9]$/.test(e.key) && !s.results[s.idx] && (q.type==='single'||q.type==='multiple')){
    var k=String.fromCharCode(64+parseInt(e.key,10));
    if(q.options[parseInt(e.key,10)-1]){
      if(q.type==='single') s.answers[s.idx]=k;
      else{
        var cur=String(s.answers[s.idx]||'');
        if(cur.indexOf(k)>=0) cur=cur.split('').filter(function(c){ return c!==k; }).join('');
        else cur=(cur+k).split('').sort().join('');
        s.answers[s.idx]=cur;
      }
      buzz(8); refreshSessionArea(); e.preventDefault(); return;
    }
  }
  if(e.key==='Enter'){
    e.preventDefault();
    if(!s.results[s.idx]) submitCurrent(s);
    else nextQuestion(s);
    return;
  }
  if(e.key===' '){
    e.preventDefault();
    nextQuestion(s);          /* 空格＝下一题／跳过，未作答也可跳 */
    return;
  }
  if(e.key==='ArrowLeft'){ prevQuestion(s); }
  if(e.key==='ArrowRight'){ nextQuestion(s); }
});

/* ============================================================
 * 23. 初始化
 * ========================================================== */
window.addEventListener('dragover', function(e){ e.preventDefault(); });
window.addEventListener('drop', function(e){
  if(!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
  e.preventDefault();
  var files=[];
  for(var i=0;i<e.dataTransfer.files.length;i++){
    var f=e.dataTransfer.files[i];
    if(/\.(xlsx|xlsm|csv|json|txt)$/i.test(f.name)) files.push(f);
  }
  if(files.length) startImport(files); else toast('仅支持 .xlsx / .csv / .json 文件');
});
window.addEventListener('hashchange', function(){
  var h=(location.hash||'').replace('#','');
  if(h && h!==AppState.view && Views[h]){ AppState.view=h; render(); }
});

// ===== 题号跳转 FAB（做题 / 背题模式通用） =====
var JP=null;
function practicePadCfg(s){
  return {
    count: s.list.length,
    getIdx: function(){ return s.idx; },
    onJump: function(i){ s.idx=i; saveProgress(s); refreshSessionArea(); }
  };
}
function reShowPracticePad(){
  var s=AppState.session;
  if(s && !s.finished) showJumpPad('practice:'+(s.pkey||s.mode||'x'), practicePadCfg(s));
}
function jumpPadEl(){
  if(JP) return JP;
  var el=document.createElement('div');
  el.className='jp';
  el.innerHTML=
    '<div class="jp-panel">'+
      '<div class="row"><div class="strong">跳转到题号</div><button class="jp-x" id="jpX" aria-label="收起">✕</button></div>'+
      '<div class="jp-big" id="jpBig">1</div>'+
      '<div class="small muted center jp-tot" id="jpTot">共 1 题</div>'+
      '<input type="range" id="jpRange" class="jp-range" min="1" max="1" value="1">'+
      '<div class="row gap8 mt12"><button class="btn sm" id="jpPrev">−</button>'+
        '<button class="btn primary flex1" id="jpGo">跳转</button>'+
        '<button class="btn sm" id="jpNext">＋</button></div>'+
    '</div>'+
    '<button class="jp-fab" id="jpFab"><span class="jp-num" id="jpNum">1</span></button>';
  document.body.appendChild(el);
  var panel=el.querySelector('.jp-panel'), fab=el.querySelector('#jpFab'),
      big=el.querySelector('#jpBig'), tot=el.querySelector('#jpTot'),
      range=el.querySelector('#jpRange'), num=el.querySelector('#jpNum');
  JP={el:el, panel:panel, fab:fab, big:big, tot:tot, range:range, num:num, ctx:null, open:false, cfg:null};
  fab.onclick=function(){ JP.open=true; el.classList.add('open'); };
  el.querySelector('#jpX').onclick=function(){ JP.open=false; el.classList.remove('open'); };
  range.addEventListener('input', function(){ big.textContent=range.value; });
  function jump(){
    if(!JP.cfg) return;
    var v=Math.max(1, Math.min(JP.cfg.count, parseInt(range.value,10)||1));
    JP.cfg.onJump(v-1);
  }
  el.querySelector('#jpGo').onclick=jump;
  el.querySelector('#jpPrev').onclick=function(){ range.value=Math.max(1, parseInt(range.value,10)-1); big.textContent=range.value; jump(); };
  el.querySelector('#jpNext').onclick=function(){ range.value=Math.min(JP.cfg?JP.cfg.count:1, parseInt(range.value,10)+1); big.textContent=range.value; jump(); };
  return JP;
}
function showJumpPad(ctx, cfg){
  jumpPadEl();
  var changed = JP.ctx!==ctx;
  JP.ctx=ctx; JP.cfg=cfg;
  JP.el.classList.add('show');
  JP.range.max = String(cfg.count);
  if(changed){ JP.open=false; JP.el.classList.remove('open'); }
  syncJumpPad();
}
function hideJumpPad(){ if(JP) JP.el.classList.remove('show'); }
function syncJumpPad(){
  if(!JP || !JP.el.classList.contains('show') || !JP.cfg) return;
  var i = JP.cfg.getIdx();
  JP.num.textContent = (i+1);
  JP.range.value = String(i+1);
  JP.big.textContent = String(i+1);
  JP.tot.textContent = '共 '+JP.cfg.count+' 题';
}

// ===== PWA：注册 Service Worker + 桌面安装 =====
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  // 相对路径注册，scope 默认与脚本同目录
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  // 捕获安装提示，可在设置中触发
  window.addEventListener('beforeinstallprompt', (e)=>{
    try{ e.preventDefault(); }catch(_){}
    window.__deferredInstall = e;
    document.dispatchEvent(new CustomEvent('pwa-installable'));
  });
  window.addEventListener('appinstalled', ()=>{
    window.__deferredInstall = null;
    document.dispatchEvent(new CustomEvent('pwa-installed'));
  });
}
registerSW();
